name: Check Hermès stock

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: stock
        name: Check product page
        shell: bash
        run: |
          result="$(node check-stock.mjs)"
          echo "$result"
          echo "status=$(jq -r .status <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "price=$(jq -r '.price // ""' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "sizes=$(jq -r 'if (.sizes | length) > 0 then .sizes | join(", ") else "確認できませんでした" end' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url <<<"$result")" >> "$GITHUB_OUTPUT"

      - name: Create stock alert
        if: steps.stock.outputs.status == 'in_stock'
        uses: actions/github-script@v7
        env:
          PRICE: ${{ steps.stock.outputs.price }}
          SIZES: ${{ steps.stock.outputs.sizes }}
          PRODUCT_URL: ${{ steps.stock.outputs.url }}
        with:
          script: |
            const title = '【在庫復活】ブレスレット 《ファランドール》';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (existing.some((issue) => issue.title === title)) {
              core.notice('An open stock alert already exists.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              assignees: [context.repo.owner],
              body: [
                'オンライン購入可能な状態を確認しました。',
                '',
                `- 価格: ${process.env.PRICE || '確認できませんでした'}`,
                `- 確認できたサイズ: ${process.env.SIZES || '確認できませんでした'}`,
                `- 商品ページ: ${process.env.PRODUCT_URL}`,
                '',
                '在庫は短時間で変動するため、すぐに商品ページで最終確認してください。',
              ].join('\n'),
            });

      - name: Reset alert after stock runs out
        if: steps.stock.outputs.status == 'out_of_stock'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '【在庫復活】ブレスレット 《ファランドール》';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            for (const issue of issues.filter((issue) => issue.title === title)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
